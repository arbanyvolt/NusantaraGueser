<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NusantaraGuesser — Tebak Sejarah Indonesia</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<style>
:root{
  --bg:#0b0e14;--panel:#151922;--panel2:#1d2330;--bd:#2d3648;
  --ink:#f1f5f9;--mut:#94a3b8;--acc:#f97316;--acc2:#fb923c;
  --gold:#facc15;--ok:#22c55e;--bad:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font-family:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* Shared UI */
.app{display:flex;flex-direction:column;min-height:100vh}
.hud{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding:10px 18px;background:rgba(15,18,25,.92);border-bottom:1px solid var(--bd);
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:30
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px;cursor:pointer}
.brand span.logo{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#dc2626);font-size:19px;box-shadow:0 4px 12px rgba(249,115,22,.35)}
.hud-pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pill b{color:var(--gold)}

.btn{
  border:1px solid var(--bd);border-radius:9px;padding:9px 15px;font-weight:700;font-size:14px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .12s,filter .15s,background .15s;background:var(--panel2);color:var(--ink)
}
.btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--acc),#ea580c);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn.lg{padding:13px 24px;font-size:16px;border-radius:12px}

/* Landing / Home Page */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 18px;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 15%,rgba(249,115,22,.16),transparent 55%),
             radial-gradient(circle at 80% 80%,rgba(56,189,248,.08),transparent 45%)
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.4);color:var(--acc2);
  font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px
}
.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px;line-height:1.08;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(135deg,#fff,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p.sub{max-width:640px;color:var(--mut);font-size:clamp(14px,2vw,17px);line-height:1.6;margin:0 0 22px}

.era-filter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--panel2);color:var(--mut);border:1px solid var(--bd);transition:all .15s
}
.chip.active{background:rgba(249,115,22,.18);color:var(--acc2);border-color:var(--acc)}

.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:960px;width:100%}
@media(max-width:780px){.feat-grid{grid-template-columns:1fr}}
.feat{background:rgba(21,25,34,.85);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:left;backdrop-filter:blur(6px)}
.feat .ic{font-size:26px;margin-bottom:6px}
.feat h3{margin:0 0 6px;font-size:15px}
.feat p{margin:0;font-size:13px;color:var(--mut);line-height:1.5}

/* Game Stage */
.stage{
  flex:1;display:grid;grid-template-columns:1fr 440px;gap:14px;padding:14px;max-width:1480px;width:100%;margin:0 auto
}
@media(max-width:1020px){.stage{grid-template-columns:1fr;padding:10px}}

/* Scene Viewer */
.viewer{
  position:relative;background:#07090d;border:1px solid var(--bd);border-radius:14px;
  overflow:hidden;min-height:440px;display:flex;align-items:center;justify-content:center;
  user-select:none;box-shadow:0 12px 30px rgba(0,0,0,.45)
}
.viewer.can-pan{cursor:grab}.viewer.panning{cursor:grabbing}
.scene-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:center center;transition:transform .08s ease-out}
.scene-img{max-width:100%;max-height:76vh;width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;filter:contrast(1.04) sepia(.1);animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.scene-fb{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;max-width:520px}
.scene-overlay-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px;z-index:5}
.scene-overlay-top>*{pointer-events:auto}
.badge-lens{background:rgba(13,15,20,.84);border:1px solid var(--bd);backdrop-filter:blur(6px);padding:6px 11px;border-radius:8px;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer}
.badge-lens:hover{border-color:var(--acc)}
.zoom-ctrl{display:flex;flex-direction:column;gap:4px;background:rgba(13,15,20,.84);border:1px solid var(--bd);padding:4px;border-radius:8px;backdrop-filter:blur(6px)}
.hint-box{
  position:absolute;bottom:12px;left:12px;right:12px;background:rgba(13,15,20,.9);
  border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:13px;
  backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5
}

/* Right Panel & Leaflet Map */
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.map-wrap{position:relative;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#0d1b2a}
#map{width:100%;height:260px;transition:height .2s ease}
.map-wrap.expanded #map{height:400px}
.map-tools{position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:4px}
.map-styles{position:absolute;bottom:8px;left:8px;z-index:10;display:flex;gap:4px}
.map-status{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.maplibregl-canvas{outline:none}

/* Era / Year Card */
.era-card{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:12px}
.year-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.year-input{width:110px;text-align:center;font-size:22px;font-weight:800;padding:6px;border-radius:8px;background:var(--bg);color:var(--gold);border:1px solid var(--bd)}
.era-tag{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(249,115,22,.15);color:var(--acc2);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc);cursor:pointer;margin:6px 0}
.step-btns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.step-btns button{padding:6px 2px;font-size:12px;border-radius:6px;background:var(--bg);color:var(--ink);border:1px solid var(--bd);cursor:pointer}
.step-btns button:hover{border-color:var(--acc);color:var(--acc2)}

/* Modal & Timeline */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:16px;max-width:780px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#resMap{width:100%;height:240px;border-radius:10px;border:1px solid var(--bd);margin:10px 0}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:600px){.score-grid{grid-template-columns:1fr}}
.sc-card{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:12px}
.sc-val{font-size:24px;font-weight:800;color:var(--gold)}
.lens-opt{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--panel2);margin:8px 0;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.lens-opt.active{border-color:var(--acc);background:rgba(249,115,22,.14)}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--panel2);margin-bottom:12px;align-items:start}
@media(max-width:560px){.tl-item{grid-template-columns:1fr}}
.tl-img{width:100%;height:96px;object-fit:cover;border-radius:8px;background:#0b0e14;border:1px solid var(--bd)}
.team-in{width:100%;padding:9px 12px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--bd);margin-bottom:8px;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SCENES = [
  {
    id:"borobudur",
    title:"Pembangunan Candi Borobudur (Dinasti Syailendra)",
    place:"Magelang, Jawa Tengah",
    year:825,lat:-7.608,lon:110.204,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Borobudur-Nothwest-view.jpg?width=1000",

    value:"Menunjukkan tingginya peradaban, keahlian teknik arsitektur tanpa perekat semen, serta toleransi budaya dan spiritual masyarakat Nusantara kuno.",

  },
  {

    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Bajang_Ratu_Gate_Trowulan.jpg?width=1000",
    prompt:"Gapura bata merah bergaya paduraksa ini berada di bekas ibu kota kerajaan maritim terbesar Nusantara. Di mana lokasinya dan sekitar abad/tahun berapa masa kejayaan kerajaan tersebut?",

    value:"Mengajarkan pentingnya persatuan Nusantara, tata kelola pemerintahan yang kuat, serta jaringan perdagangan maritim internasional.",

  {

    year:1611,lat:-4.525,lon:129.898,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Fort_Belgica_01.JPG?width=1000",
    prompt:"Benteng segilima ini dibangun VOC untuk menguasai rempah pala yang hanya tumbuh di kepulauan ini. Di mana letak benteng ini dan tahun berapa dibangun?",
    hint:"Kepulauan penghasil pala di Maluku ini menjadi pusat perebutan dagang rempah dunia pada awal abad ke-17.",
    fact:"Benteng Belgica dibangun oleh VOC di Pulau Banda Neira pada tahun 1611 atas perintah Gubernur Jenderal Pieter Both (dan diperkuat Jan Pieterszoon Coen). Benteng ini digunakan VOC untuk memaksakan monopoli perdagangan pala yang memicu perlawanan sengit para Orang Kaya (pemimpin adat) Banda.",
    value:"Mengingatkan betapa bernilainya kekayaan rempah Nusantara di mata dunia dan pentingnya menjaga kedaulatan sumber daya alam bangsa.",

  {

    place:"Makassar, Sulawesi Selatan",
    year:1667,lat:-5.134,lon:119.405,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Fort_Rotterdam_Makassar.jpg?width=1000",
    prompt:"Benteng peninggalan Kerajaan Gowa-Tallo (Ujung Pandang) ini terkait dengan perlawanan 'Ayam Jantan dari Timur' melawan VOC. Di kota mana lokasinya dan tahun berapa Perjanjian Bongaya ditandatangani?",
    hint:"Peristiwa ini berlangsung di pusat Kerajaan Gowa-Tallo di pesisir selatan Sulawesi pada pertengahan abad ke-17.",
    fact:"Awalnya bernama Benteng Ujung Pandang yang dibangun Kerajaan Gowa-Tallo pada 1545, benteng ini jatuh ke tangan VOC setelah perang panjang melawan Sultan Hasanuddin yang berakhir dengan Perjanjian Bongaya pada 18 November 1667. VOC kemudian menamainya Fort Rotterdam.",
    value:"Keteguhan Sultan Hasanuddin dalam mempertahankan kedaulatan maritim dan perdagangan bebas di Indonesia bagian timur.",
    source:"Balai Pelestarian Kebudayaan Wilayah XIX & Sejarah Nasional Indonesia Jilid III"
  },
  {
    id:"padri",
    title:"Perang Padri & Perjuangan Tuanku Imam Bonjol",

    value:"Menunjukkan bahwa persatuan antara kelompok agama dan adat mampu menjadi kekuatan besar melawan penindasan kolonial.",
    source:"Sejarah Nasional Indonesia Jilid IV (Poesponegoro & Notosusanto)"
  },
  {
    id:"diponegoro",
    title:"Akhir Perang Jawa (Penangkapan Pangeran Diponegoro)",
    place:"Magelang, Jawa Tengah",
    year:1830,lat:-7.479,lon:110.217,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Raden_Saleh_-_Diponegoro_arrest.jpg?width=1000",
    prompt:"Lukisan karya maestro Raden Saleh ini menggambarkan penangkapan pemimpin Perang Jawa secara licik saat perundingan. Di kota mana peristiwa ini terjadi dan tahun berapa?",

    value:"Keberanian moral melawan ketidakadilan serta kritik visual Raden Saleh atas pengkhianatan kolonial terhadap kehormatan bangsa.",

  },

    title:"Letusan Dahsyat Gunung Krakatau",
    place:"Selat Sunda (antara Jawa & Sumatra)",
    year:1883,lat:-6.102,lon:105.423,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Krakatoa_eruption_lithograph.jpg?width=1000",
    prompt:"Lukisan ini menggambarkan salah satu bencana letusan gunung api terdahsyat di Nusantara. Di manakah lokasinya dan kapan peristiwa ini terjadi?",

    fact:"Letusan puncak Gunung Krakatau terjadi pada 26–27 Agustus 1883 di Selat Sunda. Dentuman letusannya terdengar hingga lebih dari 4.500 km (mencapai Perth dan Pulau Rodriguez), memicu gelombang tsunami setinggi lebih dari 30 meter, dan menurunkan suhu rata-rata bumi akibat abu vulkanik di stratosfer.",
    value:"Mengajarkan pentingnya kesadaran geologis dan mitigasi bencana bagi bangsa yang hidup di jalur Cincin Api Pasifik.",
    source:"Royal Society of London Report (1888) & Badan Geologi Kementerian ESDM RI"
  },
  {
    id:"kartini",
    title:"Gagasan Emansipasi R.A. Kartini",
    place:"Jepara, Jawa Tengah",
    year:1900,lat:-6.589,lon:110.668,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/COLLECTIE_TROPENMUSEUM_Portret_van_Raden_Ajeng_Kartini_TMnr_10018776.jpg?width=900",
    prompt:"Tokoh perempuan pada foto ini menyuarakan gagasan emansipasi dan pendidikan lewat surat-suratnya. Di kota mana ia menulis gagasan tersebut dan sekitar tahun berapa?",
    hint:"Putri bupati ini tinggal di pesisir utara Jawa Tengah dan menulis surat pada pergantian abad ke-20.",
    fact:"Sekitar tahun 1899–1904, Raden Adjeng Kartini dari Jepara aktif menulis surat kepada sahabat penanya di Belanda (seperti Rosa Abendanon) berisi gagasan kemajuan perempuan pribumi, pendidikan, dan kritik feodalisme. Surat-surat itu diterbitkan pada 1911 dengan judul 'Door Duisternis tot Licht' (Habis Gelap Terbitlah Terang).",
    value:"Menginspirasi perjuangan kesetaraan hak pendidikan dan pemberdayaan perempuan di Indonesia.",
    source:"Arsip Tropenmuseum / KITLV & Buku 'Habis Gelap Terbitlah Terang'"
  },
  {
    id:"tamansiswa",
    title:"Berdirinya Perguruan Taman Siswa",

    year:1922,lat:-7.796,lon:110.369,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/Ki_Hadjar_Dewantara.jpg?width=900",

    value:"Menegaskan bahwa pendidikan adalah hak semua lapisan rakyat dan fondasi utama kemerdekaan berpikir.",
    source:"Museum Dewantara Kirti Griya & Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi RI"
  },
  {
    id:"sumpahpemuda",
    title:"Kongres Pemuda II & Sumpah Pemuda",
    place:"Jalan Kramat Raya No. 106, Jakarta",
    year:1928,lat:-6.183,lon:106.843,era:"pre",
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/MuseumSumpahPemuda.jpg?width=1000",

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const shuf=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r};
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}
function eraLabel(y){
  if(y<1200)return"Kerajaan Hindu–Buddha";
  if(y<1600)return"Kesultanan & Maritim Nusantara";
  if(y<1900)return"Masa Kolonial & Perlawanan";
  if(y<1945)return"Pergerakan Nasional";
  if(y<1950)return"Revolusi Kemerdekaan";
  return"Indonesia Modern";
}
function rankTitle(xp){
  if(xp>=25000)return"Mahapatih Sejarah";
  if(xp>=15000)return"Pujangga Nusantara";
  if(xp>=7500)return"Penjelajah Senior";
  return"Penjelajah Muda";
}

/* Web Audio SFX */
let AC=null;
function beep(f,d=0.07,t="triangle",v=0.05){
  if(!G.sfx)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfxPin=()=>beep(620,0.06,"sine",0.06);
const sfxGood=()=>{beep(523,0.08,"triangle",0.07);setTimeout(()=>beep(659,0.08,"triangle",0.07),80);setTimeout(()=>beep(784,0.16,"triangle",0.08),160)};

function confetti(){
  const w=document.createElement("div");w.className="confetti";
  const cols=["#f97316","#facc15","#22c55e","#38bdf8","#f43f5e"];
  for(let i=0;i<40;i++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"vw";p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*0.6)+"s";w.appendChild(p);
  }
  document.body.appendChild(w);setTimeout(()=>w.remove(),3200);
}
function cleanMaps(){
  if(map){try{map.remove()}catch(e){}map=null}
  if(resMap){try{resMap.remove()}catch(e){}resMap=null}
  guessMarker=null;
}

function getPool(){
  if(G.era==="pre")return SCENES.filter(s=>s.era==="pre");
  if(G.era==="post")return SCENES.filter(s=>s.era==="post");
  return SCENES;
}

function startSolo(){
  G.mode="solo";G.teams=[];
  const pool=shuf(getPool());
  G.deck=pool.slice(0,5);
  G.round=0;G.score=0;G.history=[];
  loadRound();
}

function renderTeamInputs(){
  const n=Number($("#tCount").value);

    html+=`<input class="team-in" id="tn${i}" value="Kelompok ${i+1}" maxlength="24" placeholder="Nama Kelompok ${i+1}">`;
  }
  $("#tInputs").innerHTML=html;
}
function startTeamGame(){
  const n=Number($("#tCount").value);
  G.teams=[];
  for(let i=0;i<n;i++){
    const v=($("#tn"+i).value||"").trim()||`Kelompok ${i+1}`;
    G.teams.push({name:v,score:0});
  }
  const need=n*2;
  let pool=shuf(getPool());
  while(pool.length<need)pool=pool.concat(shuf(SCENES));
  G.deck=pool.slice(0,need);
  G.mode="team";G.round=0;G.score=0;G.history=[];
  const tm=$("#teamModal");if(tm)tm.remove();
  loadRound();
}

}

          <button onclick="stepYear(-100)">-100</button>
          <button onclick="stepYear(-10)">-10</button>
          <button onclick="stepYear(-1)">-1</button>
          <button onclick="stepYear(1)">+1</button>
          <button onclick="stepYear(10)">+10</button>
          <button onclick="stepYear(100)">+100</button>
        </div>
      </div>

      <button class="btn pri" id="lockBtn" style="padding:14px;font-size:16px" ${G.guess.lat===null?"disabled":""} onclick="submitGuess()">
        🔒 KUNCI TEBAKAN
      </button>
    </aside>
  </main>`;

  initLeafletMap();
  initPan();
}

function initLeafletMap(){
  if(map){try{map.remove()}catch(e){}map=null}
  guessMarker=null;
  if(typeof maplibregl==="undefined"){
    $("#map").innerHTML=`<div style="padding:20px;text-align:center;color:var(--mut);font-size:13px">Peta OpenFreeMap memerlukan koneksi internet.</div>`;
    return;
  }
  map=new maplibregl.Map({
    container:"map",
    style:"https://tiles.openfreemap.org/styles/liberty",
    center:[118.0,-2.5],
    zoom:3.6,
    minZoom:2,
    maxZoom:16
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");

  if(G.guess.lat!==null){
    guessMarker=new maplibregl.Marker({color:"#f97316"}).setLngLat([G.guess.lon,G.guess.lat]).addTo(map);
  }
  map.on("click",e=>{
    const{lat,lng}=e.lngLat;
    G.guess.lat=lat;G.guess.lon=lng;
    sfxPin();
    if(guessMarker){guessMarker.setLngLat([lng,lat])}
    else{guessMarker=new maplibregl.Marker({color:"#f97316"}).setLngLat([lng,lat]).addTo(map)}
    $("#coordTxt").textContent=`Koordinat: ${lat.toFixed(3)}°, ${lng.toFixed(3)}°`;
    $("#pinState").textContent="📍 PIN TERPASANG";
    $("#lockBtn").disabled=false;
  });
  setTimeout(()=>map&&map.resize(),80);
}
function setMapStyle(name){
  sfxPin();
  if(map)map.setStyle(`https://tiles.openfreemap.org/styles/${name}`);
}
function resetMapView(){if(map)map.flyTo({center:[118.0,-2.5],zoom:3.6})}
function toggleMapSize(){
  G.mapExpanded=!G.mapExpanded;
  const w=$("#mapWrap");if(w)w.classList.toggle("expanded",G.mapExpanded);
  const b=document.querySelector(".map-tools button:last-child");
  if(b)b.textContent=G.mapExpanded?"🗕 Kecilkan":"⤢ Perbesar";
  setTimeout(()=>map&&map.resize(),220);
}

/* Pan & Zoom Foto Adegan */
function initPan(){
  const v=$("#viewer");
  if(!v||G.lens==="still")return;
  let dragging=false,sx=0,sy=0;
  v.onpointerdown=e=>{
    if(e.target.closest("button"))return;
    dragging=true;sx=e.clientX-G.pan.x;sy=e.clientY-G.pan.y;
    v.classList.add("panning");v.setPointerCapture(e.pointerId);
  };
  v.onpointermove=e=>{
    if(!dragging)return;
    G.pan.x=Math.max(-280,Math.min(280,e.clientX-sx));
    G.pan.y=Math.max(-220,Math.min(220,e.clientY-sy));
    const w=$("#swrap");if(w)w.style.transform=`translate(${G.pan.x}px,${G.pan.y}px) scale(${G.pan.scale})`;
  };
  v.onpointerup=()=>{dragging=false;v.classList.remove("panning")};
  if(G.lens==="free"){v.onwheel=e=>{e.preventDefault();zoomBy(e.deltaY<0?0.18:-0.18)}}
}
function zoomBy(d){
  G.pan.scale=Math.max(1,Math.min(2.8,+(G.pan.scale+d).toFixed(2)));
  const w=$("#swrap");if(w)w.style.transform=`translate(${G.pan.x}px,${G.pan.y}px) scale(${G.pan.scale})`;
}
function resetPan(){
  G.pan={x:0,y:0,scale:1};
  const w=$("#swrap");if(w)w.style.transform=`translate(0px,0px) scale(1)`;
}

function setYear(v){
  const y=Math.max(600,Math.min(2025,parseInt(v)||2025));
  G.guess.year=y;
  $("#yearIn").value=y;$("#yearRange").value=y;
  $("#eraTag").textContent=eraLabel(y);
}
function stepYear(d){sfxPin();setYear(G.guess.year+d)}

function submitGuess(){
  const sc=G.deck[G.round];
  const dist=haversine(G.guess.lat,G.guess.lon,sc.lat,sc.lon);
  const yDiff=Math.abs(G.guess.year-sc.year);

  const locPts=Math.round(2500*Math.exp(-dist/450));
  const yrPts=Math.round(2500*Math.exp(-yDiff/38));
  let total=Math.round((locPts+yrPts)*LENS_INFO[G.lens].mult);
  if(G.hintUsed)total=Math.round(total*0.9);

  const curTeam=G.mode==="team"?G.teams[G.round%G.teams.length]:null;
  if(curTeam){curTeam.score+=total}
  G.score+=total;
  G.totalXp+=total;
  localStorage.setItem("ng_xp",G.totalXp);
  G.history.push({sc,dist,yDiff,total,locPts,yrPts,team:curTeam?curTeam.name:null});
  sfxGood();

  const react=total>=4500?"🎯 TEPAT SASARAN!":total>=3200?"🔥 LUAR BIASA!":total>=1800?"👍 CUKUP AKURAT!":"🧭 TERUS BERLATIH!";
  const totalR=G.deck.length;
  const m=document.createElement("div");m.className="ov";m.id="resModal";
  m.innerHTML=`<div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="era-tag">HASIL RONDE ${String(G.round+1).padStart(2,"0")}/${String(totalR).padStart(2,"0")}${curTeam?` · ${esc(curTeam.name)}`:""}</span>
        <span class="era-tag" style="background:rgba(34,197,94,.18);color:var(--ok)">${react}</span>
      </div>
      <span class="mono" id="cntPts" style="color:var(--gold);font-weight:800;font-size:22px">+0 POIN</span>
    </div>
    <h2 style="margin:8px 0 4px">${sc.title}</h2>
    <div style="color:var(--mut);font-size:14px">📍 ${sc.place} · 📅 Tahun <b>${sc.year}</b></div>

    <div id="resMap"></div>

    <div class="score-grid">
      <div class="sc-card">
        <div class="sec-title">AKURASI LOKASI</div>
        <div class="sc-val">${locPts.toLocaleString("id-ID")} <span style="font-size:13px;color:var(--mut)">/ 2.500</span></div>
        <div style="font-size:13px;color:var(--mut)">Jarak tebakan: <b style="color:var(--ink)">${dist.toLocaleString("id-ID")} km</b> (🟠 Tebakan · 🟢 Asli)</div>
      </div>
      <div class="sc-card">
        <div class="sec-title">AKURASI TAHUN</div>
        <div class="sc-val">${yrPts.toLocaleString("id-ID")} <span style="font-size:13px;color:var(--mut)">/ 2.500</span></div>
        <div style="font-size:13px;color:var(--mut)">Tebakanmu <b>${G.guess.year}</b> · Selisih: <b style="color:var(--ink)">${yDiff} tahun</b></div>
      </div>
    </div>

    <div class="era-card" style="margin-bottom:10px">
      <div style="font-weight:700;margin-bottom:4px;color:var(--acc2)">📖 Penjelasan Sejarah</div>
      <div style="font-size:14px;line-height:1.58">${sc.fact}</div>
      <div style="font-size:12px;color:var(--mut);margin-top:6px">📚 <b>Sumber:</b> ${sc.source}</div>
    </div>
    <div class="era-card" style="margin-bottom:14px;border-color:rgba(34,197,94,.4)">
      <div style="font-weight:700;margin-bottom:4px;color:var(--ok)">🌟 Makna & Nilai Keteladanan</div>
      <div style="font-size:14px;line-height:1.55">${sc.value}</div>
    </div>

    <button class="btn pri" style="width:100%;padding:13px;font-size:15px" onclick="nextRound()">
      ${G.round<totalR-1?"RONDE BERIKUTNYA →":"LIHAT RINGKASAN AKHIR 🏆"}
    </button>
  </div>`;
  document.body.appendChild(m);

  /* Animasi count-up skor */
  let cur=0;const step=Math.max(1,Math.ceil(total/22));
  const iv=setInterval(()=>{
    cur=Math.min(total,cur+step);
    const el=$("#cntPts");if(el)el.textContent=`+${cur.toLocaleString("id-ID")} POIN`;
    if(cur>=total)clearInterval(iv);
  },20);

  if(typeof maplibregl!=="undefined"){
    setTimeout(()=>{
      if(resMap){try{resMap.remove()}catch(e){}resMap=null}
      resMap=new maplibregl.Map({
        container:"resMap",
        style:"https://tiles.openfreemap.org/styles/liberty",
        center:[sc.lon,sc.lat],
        zoom:5
      });
      resMap.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
      const p1=[G.guess.lon,G.guess.lat],p2=[sc.lon,sc.lat];
      new maplibregl.Marker({color:"#f97316"}).setLngLat(p1).setPopup(new maplibregl.Popup().setText("Tebakanmu")).addTo(resMap);
      new maplibregl.Marker({color:"#22c55e"}).setLngLat(p2).setPopup(new maplibregl.Popup().setText(sc.place)).addTo(resMap);
      resMap.on("load",()=>{
        resMap.addSource("line",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:[p1,p2]}}});
        resMap.addLayer({id:"line",type:"line",source:"line",paint:{"line-color":"#facc15","line-width":3,"line-dasharray":[2,2]}});
      });
      const bounds=new maplibregl.LngLatBounds();bounds.extend(p1);bounds.extend(p2);
      resMap.fitBounds(bounds,{padding:45,maxZoom:10,duration:450});
    },60);
  }
}

function nextRound(){
  if(resMap){try{resMap.remove()}catch(e){}resMap=null}
  const m=$("#resModal");if(m)m.remove();
  if(G.round<G.deck.length-1){G.round++;loadRound()}else{showSummary()}
}

function showSummary(){
  confetti();sfxGood();
  if(G.mode==="solo"&&G.score>G.best){G.best=G.score;localStorage.setItem("ng_best",G.best)}
  const maxS=G.deck.length*5000;
  const pct=Math.min(100,Math.round(G.score/maxS*100));
  const sortedTeams=G.mode==="team"?G.teams.slice().sort((a,b)=>b.score-a.score):[];
  const medals=["🥇","🥈","🥉","🏅"];

  const m=document.createElement("div");m.className="ov";m.id="sumModal";
  m.innerHTML=`<div class="modal" style="text-align:center">
    <div style="font-size:52px">🏆</div>
    <h2 style="margin:6px 0">${G.mode==="team"?"HASIL DUEL KELOMPOK!":"MISI SELESAI!"}</h2>
    <p style="color:var(--mut);margin-top:0">Pangkat Akun: <b style="color:var(--gold)">${rankTitle(G.totalXp)}</b></p>

    ${G.mode==="team"?`
      <div style="text-align:left;margin:14px 0">
        ${sortedTeams.map((t,i)=>`
          <div class="sc-card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;${i===0?"border-color:var(--gold)":""}">
            <span style="font-size:16px;font-weight:700">${medals[i]||"🏅"} ${esc(t.name)}</span>
            <span class="mono" style="font-size:20px;font-weight:800;color:var(--gold)">${t.score.toLocaleString("id-ID")} pts</span>
          </div>`).join("")}
      </div>
    `:`
      <div class="sc-card" style="margin:14px 0">
        <div class="sec-title" style="justify-content:center">TOTAL SKOR SESI (${G.deck.length} RONDE)</div>
        <div class="sc-val" style="font-size:36px">${G.score.toLocaleString("id-ID")}</div>
        <div style="font-size:13px;color:var(--mut)">Akurasi Keseluruhan: ${pct}% · Rekor Terbaik: ${G.best.toLocaleString("id-ID")}</div>
      </div>
    `}

    <div style="text-align:left;margin:14px 0">
      ${G.history.map((h,i)=>`
        <div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--bd);font-size:13px;gap:8px">
          <span><b>0${i+1}.</b> ${h.team?`[${esc(h.team)}] `:""}${h.sc.title} (${h.sc.year})</span>
          <span class="mono" style="color:var(--gold);white-space:nowrap">+${h.total.toLocaleString("id-ID")} (${h.dist} km · ±${h.yDiff} thn)</span>
        </div>`).join("")}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" style="flex:1;padding:13px" onclick="document.getElementById('sumModal').remove();renderHome()">🏠 BERANDA</button>
      <button class="btn pri" style="flex:2;padding:13px" onclick="document.getElementById('sumModal').remove();${G.mode==="team"?"openTeamSetup()":"startSolo()"}">▶ MAIN LAGI</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

/* ==================== ARSIP & LINIMASA + MODAL LAIN ==================== */
function openTimeline(){
  const sorted=SCENES.slice().sort((a,b)=>a.year-b.year);
  const m=document.createElement("div");m.className="ov";m.id="tlModal";
  m.innerHTML=`<div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">📚 Arsip & Linimasa Sejarah Indonesia</h2>
      <button class="btn sm" onclick="document.getElementById('tlModal').remove()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--mut);margin-top:0">Pelajari urutan kronologis peristiwa dan tokoh penting Nusantara sebelum bermain.</p>
    ${sorted.map(s=>`
      <div class="tl-item">
        <img class="tl-img" src="${s.img}" alt="${esc(s.title)}" loading="lazy" onerror="this.style.display='none'">
        <div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
            <span class="era-tag mono">${s.year}</span>
            <span style="font-size:12px;color:var(--mut)">📍 ${s.place}</span>
          </div>
          <h4 style="margin:0 0 6px;font-size:15px">${s.title}</h4>
          <p style="margin:0 0 6px;font-size:13px;color:var(--mut);line-height:1.55">${s.fact}</p>
          <div style="font-size:12px;color:var(--ok);margin-bottom:4px"><b>Nilai Sejarah:</b> ${s.value}</div>
          <div style="font-size:11px;color:var(--mut)">📚 <b>Sumber:</b> ${s.source}</div>

function openLensModal(fromHome){
  const m=document.createElement("div");m.className="ov";m.id="lensModal";
  m.innerHTML=`<div class="modal" style="max-width:460px">
    <h3 style="margin-top:0">🔍 Pilih Mode Lensa</h3>
    <p style="font-size:13px;color:var(--mut)">Ubah cara kamu mengamati foto sejarah untuk mendapatkan bonus skor.</p>
    ${Object.entries(LENS_INFO).map(([k,v])=>`
      <button class="lens-opt ${G.lens===k?"active":""}" onclick="G.lens='${k}';G.pan={x:0,y:0,scale:1};document.getElementById('lensModal').remove();${fromHome?"renderHome()":"renderGame()"}">
        <div><b>${v.name}</b><div style="font-size:12px;color:var(--mut)">${v.desc}</div></div>
        <span>${G.lens===k?"✅":""}</span>
      </button>`).join("")}
    <button class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('lensModal').remove()">Tutup</button>
  </div>`;
  document.body.appendChild(m);
}

function openHelp(){
  const m=document.createElement("div");m.className="ov";m.id="helpModal";
  m.innerHTML=`<div class="modal" style="max-width:520px">
    <h3 style="margin-top:0">📖 Cara Bermain NusantaraGuesser</h3>
    <ol style="line-height:1.65;font-size:14px;padding-left:20px">
      <li>Pilih <b>Main Solo</b> (5 ronde) atau <b>Mode Kelompok</b> (2–4 tim bergantian untuk duel kelas).</li>
      <li>Amati foto arsip dan baca <b>pertanyaan pengarah</b> di bagian bawah gambar.</li>
      <li>Zoom in / geser <b>Peta Indonesia</b> layaknya Maps, lalu klik lokasi kejadian untuk memasang pin.</li>
      <li>Atur <b>Tahun</b> menggunakan slider, input angka, atau tombol lompat waktu.</li>
      <li>Tekan <b>Kunci Tebakan</b> untuk melihat skor akurasi jarak (km), selisih tahun, fakta sejarah, dan nilai keteladanan!</li>
    </ol>
    <button class="btn pri" style="width:100%" onclick="document.getElementById('helpModal').remove()">Siap Bermain!</button>
  </div>`;
  document.body.appendChild(m);
}

function openAbout(){
  const m=document.createElement("div");m.className="ov";m.id="aboutModal";
  m.innerHTML=`<div class="modal" style="max-width:540px">
    <h3 style="margin-top:0">ℹ️ Tentang Projek & Sumber</h3>
    <p style="font-size:14px;line-height:1.6"><b>NusantaraGuesser</b> adalah aplikasi web game edukasi sejarah Indonesia untuk tugas <b>PSAS Sejarah (XI PPLG 2)</b>.</p>
    <div class="era-card" style="margin-bottom:12px">
      <div style="font-weight:700;margin-bottom:6px;color:var(--acc2)">🛠️ Teknologi Web</div>
      <div style="font-size:13px;color:var(--mut);line-height:1.55">HTML5, CSS3, Vanilla JavaScript, MapLibre GL JS (Peta Vektor Interaktif), Web Audio API (Efek Suara), dan LocalStorage.</div>
    </div>
    <div class="era-card" style="margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:6px;color:var(--acc2)">📚 Sumber Arsip & Peta</div>
      <div style="font-size:13px;color:var(--mut);line-height:1.55">
        • Foto & Arsip Sejarah: Domain Publik Wikimedia Commons<br>
        • Peta Interaktif: OpenFreeMap (Vector Tiles)
      </div>
    </div>
    <button class="btn pri" style="width:100%" onclick="document.getElementById('aboutModal').remove()">Tutup</button>
  </div>`;
  document.body.appendChild(m);
}

/* Keyboard Shortcuts: Panah Kiri/Kanan ubah tahun, Enter kunci tebakan / lanjut ronde */
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if($("#resModal")){if(e.key==="Enter"){e.preventDefault();nextRound()}return}
  if(!$("#map"))return;
  const delta=e.shiftKey?10:1;
  if(e.key==="ArrowLeft"){e.preventDefault();stepYear(-delta)}
  else if(e.key==="ArrowRight"){e.preventDefault();stepYear(delta)}
  else if(e.key==="Enter"&&G.guess.lat!==null){e.preventDefault();submitGuess()}
});

renderHome();
</script>
</body>
